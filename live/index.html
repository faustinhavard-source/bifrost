<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BIFROST, the next move is physical</title>
<meta name="description" content="Bifrost Robotics Program. 45 robotics founders. One week in Zurich, then two weeks in Shenzhen. The Bridge x Pluto House.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=JetBrains+Mono:wght@400&display=swap">

html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#f4f6f5;overscroll-behavior:none}
.stage{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#000}
.scroller{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroller::-webkit-scrollbar{display:none}
.scroller:focus-visible{outline:2px solid #c6ebff;outline-offset:-4px}
.track{position:relative;width:300vw;height:100%}
canvas{position:sticky;left:0;top:0;display:block;width:100vw;height:100%;touch-action:pan-x}
.slides{position:absolute;inset:0;display:flex;pointer-events:none}
.slide{position:relative;width:100vw;height:100%;flex:none}
.logo-btn{position:absolute;left:50%;top:50%;width:40vh;height:40vh;transform:translate(-50%,-50%);pointer-events:auto;margin:0;padding:0;border:0;border-radius:50%;background:none;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.logo-btn:active{cursor:grabbing}
.logo-btn:focus-visible{outline:2px solid #c6ebff;outline-offset:10px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
</style>
</head>

<main class="stage">
<h1 class="sr-only">Bifrost. The next move is physical.</h1>
<p class="sr-only">Bifrost Robotics Program. 45 robotics founders. One week in Zurich, then two weeks in Shenzhen. The Bridge x Pluto House.</p>
<div class="scroller" id="scroller" tabindex="0" role="region" aria-label="Bifrost, three slides, scroll sideways">
<div class="track">
<canvas id="view" role="img" aria-label="Clear glass streams flowing across a night sky, splitting white light into a spectrum"></canvas>
<div class="slides">
<section class="slide" aria-label="Bifrost"><button class="logo-btn" id="logo" type="button" aria-label="Bifrost symbol in clear glass. Press and hold to spin it"></button></section>
<section class="slide" aria-label="Program"></section>
<section class="slide" aria-label="Founders"></section>
</div>
</div>
</div>
</main>
