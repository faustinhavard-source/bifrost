<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIFROST — The next move is physical.</title>
<meta name="description" content="BIFROST Robotics Program. 45 robotics founders. 1 week in Zurich, then 2 weeks in Shenzhen. The Bridge × Pluto House.">
<meta name="theme-color" content="#167cbb">
<link rel="preload" href="/assets/bifrost-clouds.jpg?v=7ae8c963" as="image">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#167cbb;color:#fffdf8;font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
main{position:relative;width:100%;height:100svh;height:100dvh;overflow:hidden;isolation:isolate}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:-1}
header{position:absolute;top:7.7%;left:50%;transform:translateX(-50%);width:min(54%,860px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:clamp(24px,6vw,100px)}
.nav{padding:8px 0;color:inherit;border:0;background:none;font:300 clamp(12px,1.55vw,22px)/1 Arial,Helvetica,sans-serif;letter-spacing:.035em;text-transform:uppercase;cursor:pointer}
.nav:first-child{text-align:left}.nav:last-child{text-align:right}
.nav:hover{opacity:.65}.nav:focus-visible,.close:focus-visible{outline:1px solid currentColor;outline-offset:7px}
.brand{font-family:'Arial Black',Arial,Helvetica,sans-serif;font-weight:900;font-size:clamp(22px,2.75vw,40px);letter-spacing:-.055em;line-height:1;transform:scaleX(1.12)}
.hero{position:absolute;left:2%;right:2%;top:16.3%;text-align:center}
h1{margin:0;font-family:Didot,'Bodoni MT','Times New Roman',serif;font-size:min(10.5vw,15.2dvh);font-weight:400;line-height:.9;letter-spacing:-.055em;text-transform:uppercase}
h1 span{display:block;white-space:nowrap}
dialog{color:#fffdf8;background:#123c58f5;border:1px solid #fffdf83b;width:min(490px,calc(100% - 40px));padding:48px 38px 36px;box-shadow:0 20px 100px #123c5840;max-height:90dvh}
dialog::backdrop{background:#123c5838;backdrop-filter:blur(10px)}
dialog h2{font:400 38px/1.1 Didot,'Times New Roman',serif;margin:0 0 24px}
dialog p{font-size:15px;line-height:1.65;margin:14px 0}
dialog .small{font-size:12px;opacity:.7;margin-top:25px}
.close{position:absolute;right:17px;top:12px;color:inherit;background:none;border:0;font:300 26px/1 Arial;cursor:pointer;padding:5px}
@media(max-width:600px){
header{top:6%;width:calc(100% - 48px);gap:20px}.brand{font-size:23px}.nav{font-size:10px;letter-spacing:.02em}
.hero{top:17%;left:3%;right:3%}h1{font-size:11.7vw;line-height:1.02;letter-spacing:-.055em}
.art{object-position:50% 50%}
}
@media(max-height:450px) and (min-width:601px){header{top:6%}.hero{top:19%}.brand{font-size:23px}.nav{font-size:12px}}
</style>
</head>
<body>
<main>
<img class="art" src="/assets/bifrost-clouds.jpg?v=7ae8c963" alt="" fetchpriority="high">
<header aria-label="Main navigation">
<button class="nav" type="button" data-dialog="program">Program</button>
<div class="brand">BIFROST</div>
<button class="nav" type="button" data-dialog="partners">Partners</button>
</header>
<section class="hero"><h1><span>The next move</span><span>is physical</span></h1></section>
</main>
<dialog id="program" aria-labelledby="program-title"><button class="close" type="button" aria-label="Close">×</button><h2 id="program-title">A call to build.</h2><p>Humanoids. Machines.<br>Things that move.</p><p>45 robotics founders.<br>Starting with 1 week in Zurich,<br>then 2 weeks in Shenzhen.</p><p class="small">Let's get to work.</p></dialog>
<dialog id="partners" aria-labelledby="partners-title"><button class="close" type="button" aria-label="Close">×</button><h2 id="partners-title">Partners</h2><p>The Bridge × Pluto House</p></dialog>
<script>
document.querySelectorAll('[data-dialog]').forEach(button=>button.addEventListener('click',()=>document.getElementById(button.dataset.dialog).showModal()));
document.querySelectorAll('dialog').forEach(dialog=>{
dialog.querySelector('.close').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close()}});
});
</script>
</body></html>
