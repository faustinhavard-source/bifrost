<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIFROST — The next move is physical.</title>
<meta name="description" content="BIFROST Robotics Program. 45 robotics founders. Starting with 1 week in Zurich, then 2 weeks in Shenzhen. The Bridge × Pluto House.">
<meta name="theme-color" content="#1d546e">
<link rel="preload" href="/assets/bifrost-clouds.jpg?v=5246a5a" as="image">
<style>
:root{color-scheme:dark;--paper:#f3eee2;--mx:0px;--my:0px}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#1d546e;color:var(--paper);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
::selection{color:#24152e;background:#edb893}
main{width:100%;height:100svh;height:100dvh;position:relative;overflow:hidden;isolation:isolate}
.world{position:absolute;left:50%;top:50%;width:max(100vw,150dvh);height:max(100dvh,66.6667vw);transform:translate(-50%,-50%);z-index:-3;pointer-events:none}
.parallax{width:100%;height:100%;position:relative;transform:translate(var(--mx),var(--my)) scale(1.025);transition:transform 1.5s cubic-bezier(.2,.6,.2,1)}
.art{position:absolute;inset:0;width:100%;height:100%;display:block}
.radiance{position:absolute;left:41.5%;top:42%;width:17%;height:26%;background:radial-gradient(ellipse,#fff0ca36,transparent 66%);mix-blend-mode:screen;animation:light 8s ease-in-out infinite alternate}



.veil{position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,#143a4e35,transparent 57%),linear-gradient(0deg,#153448ab,transparent 22%,transparent 85%,#15344818);pointer-events:none}
header{position:absolute;top:0;left:0;width:100%;padding:28px 4.2vw;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{font-size:26px;font-weight:600;letter-spacing:-1.8px;line-height:1}
.header-right{display:flex;align-items:center;gap:28px}
.program{font:10px/1.3 'Courier New',monospace;letter-spacing:.16em;text-transform:uppercase;color:#ede7e2b3}
.motion{border:1px solid #eee5d84a;border-radius:50%;height:31px;width:31px;background:transparent;color:var(--paper);cursor:pointer;display:grid;place-items:center;transition:background .2s,border-color .2s}
.motion:hover{background:#ffffff15;border-color:#eee5d8}.motion:focus-visible{outline:2px solid #f0c49a;outline-offset:5px}
.motion svg{height:11px;width:11px;fill:currentColor}.play{display:none}.motion-paused .pause{display:none}.motion-paused .play{display:block}
.hero{position:absolute;top:24%;left:4.2vw;width:47%}
h1{font-size:clamp(64px,7.5vw,130px);line-height:.92;letter-spacing:-.075em;font-weight:400;margin:0}
h1 span{display:block}h1 em{font-family:Georgia,'Times New Roman',serif;font-size:1.04em;font-weight:400;letter-spacing:-.07em;line-height:1.04}
.manifesto{margin-top:30px;display:grid;grid-template-columns:minmax(100px,.7fr) 1.3fr;gap:22px;max-width:380px;font-size:12px;line-height:1.5;letter-spacing:-.02em;color:#f5ede3bd}
.manifesto p{margin:0}.manifesto p:first-child{color:var(--paper)}
.work{position:absolute;left:4.2vw;bottom:17%;font:10px/1.4 'Courier New',monospace;letter-spacing:.12em;text-transform:uppercase;margin:0;color:#f1e9dfb8}
footer{position:absolute;left:4.2vw;right:4.2vw;bottom:27px;padding-top:19px;border-top:1px solid #eee5d82b;display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:24px;align-items:end;font-size:12px;line-height:1.4;letter-spacing:-.01em;color:#f5ede3e0}
footer p{margin:0}.route{text-align:center}.partners{text-align:right}.count{font-size:20px;letter-spacing:-.05em;padding-right:6px}
@keyframes light{from{opacity:.35}to{opacity:1}}
.motion-paused .radiance{animation-play-state:paused}.motion-paused .parallax{transform:scale(1.025)}
@media(min-width:1800px){.hero{top:25%}h1{font-size:min(8vw,18vh)}}
@media(max-width:900px) and (min-width:601px){.hero{width:52%;top:28%}h1{font-size:8.2vw}.manifesto{font-size:11px;gap:15px;grid-template-columns:1fr}.manifesto br{display:none}}
@media(max-width:600px){
header{padding:23px 22px;gap:15px}.brand{font-size:24px}.header-right{gap:13px}.program{font-size:8px;letter-spacing:.07em}.motion{height:27px;width:27px}
.world{left:50%;transform:translate(-50%,-50%)}.veil{background:linear-gradient(180deg,#173c5555,transparent 44%,#15344815 66%,#153448cc)}
.hero{top:14%;left:22px;width:calc(100% - 44px)}
h1{font-size:clamp(46px,14vw,74px);line-height:.91;letter-spacing:-.075em}
.manifesto{margin-top:20px;font-size:10px;line-height:1.4;max-width:280px;gap:15px;grid-template-columns:.8fr 1.2fr}
.work{left:22px;bottom:17%;font-size:9px;letter-spacing:.08em}

footer{left:22px;right:22px;bottom:19px;padding-top:13px;font-size:10px;gap:12px;grid-template-columns:1fr 1fr}
.cohort{grid-column:1/-1}.count{font-size:15px}.route{text-align:left}.partners{text-align:right}
}
@media(max-height:650px) and (min-width:601px){
header{padding-top:19px}.hero{top:22%}h1{font-size:14vh}.manifesto{margin-top:20px;font-size:11px}.work{bottom:19%}
footer{bottom:18px;padding-top:12px;font-size:11px}.count{font-size:17px}
}
@media(max-height:700px) and (max-width:600px){
.hero{top:14%}h1{font-size:8.1vh}.manifesto{margin-top:12px;font-size:9px}.work{bottom:18%;font-size:8px}
footer{font-size:9px;bottom:14px;padding-top:10px;gap:7px}
}
@media(prefers-reduced-motion:reduce){.radiance{animation:none}.parallax{transition:none;transform:scale(1.025)}}
</style>
</head>
<body><main>
<div class="world" aria-hidden="true"><div class="parallax"><img class="art" src="/assets/bifrost-clouds.jpg?v=5246a5a" alt="" fetchpriority="high"><div class="radiance"></div></div></div><div class="veil" aria-hidden="true"></div>
<header><div class="brand">BIFROST</div><div class="header-right"><div class="program">Robotics Program</div><button class="motion" type="button" aria-label="Pause animation" aria-pressed="false"><svg viewBox="0 0 12 12" aria-hidden="true"><path class="pause" d="M2 1h3v10H2zm5 0h3v10H7z"/><path class="play" d="M2 0 12 6 2 12z"/></svg></button></div></header>
<section class="hero"><h1><span>The next</span><span>move is</span><span><em>physical.</em></span></h1><div class="manifesto"><p>A call to build.</p><p>Humanoids. Machines.<br>Things that move.</p></div></section>
<p class="work">Let's get to work.</p>
<footer><p class="cohort"><span class="count">45</span> robotics founders</p><p class="route">Starting with 1 week in Zurich,<br>then 2 weeks in Shenzhen.</p><p class="partners">The Bridge × Pluto House</p></footer>
</main>
<script>
(()=>{
const root=document.documentElement,button=document.querySelector('.motion'),reduced=matchMedia('(prefers-reduced-motion: reduce)');
let paused=reduced.matches;
function update(){root.classList.toggle('motion-paused',paused);button.setAttribute('aria-pressed',String(paused));button.setAttribute('aria-label',paused?'Play animation':'Pause animation');document.dispatchEvent(new Event('bifrost:motion'));}
button.addEventListener('click',()=>{paused=!paused;update()});
reduced.addEventListener('change',()=>{paused=reduced.matches;update()});update();
if(matchMedia('(pointer:fine)').matches){
window.addEventListener('pointermove',e=>{if(paused||reduced.matches)return;root.style.setProperty('--mx',((e.clientX/innerWidth-.5)*8).toFixed(2)+'px');root.style.setProperty('--my',((e.clientY/innerHeight-.5)*6).toFixed(2)+'px')},{passive:true});
document.addEventListener('pointerleave',()=>{root.style.setProperty('--mx','0px');root.style.setProperty('--my','0px')});
}
})();
</script>
</body></html>
